ninsula (modern Quebec) and claimed the land for France.","slug":null},{"year":1539,"type":"event","text":"Hernando de Soto had 200 executed, in what was to be called Napituca Massacre.","slug":null},{"year":1540,"type":"event","text":"Francisco Vázquez de Coronado is infamous for the Tiguex Massacres, after seizing the houses, food and clothing of the Tiwa Puebloans and raped their people, his army found themselves in conflict with the Rio Grande natives, which led to the brutal Tiguex War.","slug":null},{"year":1540,"type":"event","text":"Pedro de Tovar comes in contact with the Hopi people at Oraibi as part of the expedition led by Francisco Vázquez de Coronado","slug":null},{"year":1541,"type":"event","text":"Hernando de Soto discovers the Mississippi River, strengthening Spanish claims to the interior of North America.","slug":null},{"year":1562,"type":"event","text":"Jean Ribault, leaves France with 150 colonists for the New World, establishing Charlesfort on Parris Island in South Carolina, which was abandoned several years later.","slug":null},{"year":1564,"type":"event","text":"French Fort Caroline established on the banks of the St. Johns River, Florida; Colonized by huguenots, sacked by Pedro Menéndez de Avilés in 1565.","slug":null},{"year":1565,"type":"event","text":"Admiral Pedro Menéndez de Avilés founds St. Augustine, Florida, the earliest successful Spanish/European settlement in the future continental United States.","slug":null},{"year":1570,"type":"event","text":"Iroquois Confederacy founded.","slug":null},{"year":1579,"type":"event","text":"Francis Drake claims the lands of California for England and Queen Elizabeth I, landing in Drake's Bay and naming it New Albion.","slug":null},{"year":1585,"type":"event","text":"Sir Walter Raleigh founds Roanoke Colony, the first English settlement in the New World, though he never set foot in it.","slug":null},{"year":1587,"type":"event","text":"Virginia Dare was born on Roanoke, making her the first English child known to be born in the New World. The first Asians to set foot on what would be the United States occurred when Filipino sailors arrived in Spanish ships at Morro Bay, California; see Landing of the first Filipinos.","slug":null},{"year":1588,"type":"event","text":"First battle of the English against the Spanish Armada begins, leading to their defeat and the lessening of Spain's influence in the New World and the rise of English influence in the Americas.","slug":null},{"year":1590,"type":"event","text":"Roanoke Colony found deserted.","slug":null},{"year":1599,"type":"event","text":"Juan de Oñate and Vicente de Zaldívar committed the Ácoma Massacre killing approximately 500 warriors and 300 civilians of the Acoma Pueblos. And committed the Sandia Mountains massacre, killing 900 Tompiro Indians. King Philip III later punished Oñate for his cruelty.","slug":null},{"year":1602,"type":"event","text":"Bartholomew Gosnold is the first Englishman to land on the New England coast, exploring and naming Cape Cod and Martha's Vineyard.","slug":null},{"year":1605,"type":"event","text":"First capital of Acadia (French) was established as Port-Royal in modern-day Nova Scotia; it lasted until 1613. George Weymouth explores New England.","slug":null},{"year":1606,"type":"event","text":"The joint-stock company Virginia Company of London is founded and granted a Royal Charter by James I to settle in the New World.","slug":null},{"year":1607,"type":"event","text":"Establishment of Jamestown, the first permanent English settlement in the Americas. The short lived Popham Colony founded in Maine by the Virginia Company of Plymouth.","slug":null},{"year":1608,"type":"event","text":"Founding of Quebec (Habitation de Québec) by Samuel de Champlain.","slug":null},{"year":1609,"type":"event","text":"10 – The Starving Time at Jamestown.","slug":null},{"year":1609,"type":"event","text":"Henry Hudson explores the Hudson River and Delaware Bay for the Dutch.","slug":null},{"year":1610,"type":"event","text":"Santa Fe, New Mexico established by Spain","slug":null},{"year":1612,"type":"event","text":"The Dutch establish a fur trading center with the Native Americans on Manhattan Island.","slug":null},{"year":1614,"type":"event","text":"Dutch claim New Netherland. John Rolfe successfully harvests tobacco in Jamestown, Virginia, ensuring the colony's success.","slug":null},{"year":1615,"type":"event","text":"Fort Nassau (North River) founded near Albany, New York.","slug":null},{"year":1617,"type":"event","text":"19 – Smallpox kills roughly 90% of the Massachusetts Bay Indians","slug":null},{"year":1618,"type":"birth","text":"John Lawrence born","slug":"lawrence-john-1618-1699"},{"year":1619,"type":"event","text":"First enslaved Africans to the North American colonies arrived in Jamestown, Virginia aboard the White Lion. The House of Burgesses, the first democratically elected legislative body in English North America was formed in Jamestown.","slug":null},{"year":1619,"type":"event","text":"Squanto return to northeast America after living in England.","slug":null},{"year":1620,"type":"event","text":"Mayflower Compact signed. Plymouth Colony is founded in what would be Massachusetts, by the Plymouth Company.","slug":null},{"year":1621,"type":"event","text":"Anthony Johnson is held as an Indentured servant in the Colony of Virginia.","slug":null},{"year":1622,"type":"event","text":"Indian massacre of 1622 in Virginia.","slug":null},{"year":1624,"type":"event","text":"King James I revokes the Virginia Company's charter, and Virginia becomes a royal colony. Foundation of New Amsterdam by the Dutch West India Company; would later be renamed New York.","slug":null},{"year":1625,"type":"event","text":"King James I dies; King Charles I becomes King of England","slug":null},{"year":1628,"type":"event","text":"Massachusetts Bay Colony founded.","slug":null},{"year":1630,"type":"event","text":"Winthrop Fleet to Massachusetts Bay Colony. Manor of Rensselaerswyck founded. Boston founded.","slug":null},{"year":1632,"type":"event","text":"Province of Maryland founded.","slug":null},{"year":1634,"type":"event","text":"Theologian Roger Williams banished from Massachusetts Bay Colony.","slug":null},{"year":1636,"type":"event","text":"Colony of Rhode Island and Providence Plantations founded by Roger Williams.","slug":null},{"year":1636,"type":"event","text":"Connecticut Colony founded by Thomas Hooker.","slug":null},{"year":1636,"type":"event","text":"Harvard College founded.","slug":null},{"year":1637,"type":"event","text":"New Haven Colony founded.","slug":null},{"year":1638,"type":"event","text":"Pequot War ends in New England. New Sweden established around the southern Delaware River by Peter Minuit.","slug":null},{"year":1638,"type":"event","text":"Roger Williams founded the First Baptist Church in America.","slug":null},{"year":1638,"type":"event","text":"The Free Grace Controversy ended, when Anne Hutchinson was banished from the Massachusetts Bay Colony.","slug":null},{"year":1639,"type":"event","text":"Fundamental Agreement of the New Haven Colony signed. Fundamental Orders of Connecticut adopted and the Crown formally recognizes the Virginia Assembly.","slug":null},{"year":1640,"type":"birth","text":"Mary Lawrence born","slug":"lawrence-mary-1640-1704"},{"year":1640,"type":"event","text":"French and Iroquois Wars escalate to full warfare.","slug":null},{"year":1640,"type":"event","text":"Virginia courts sentence John Punch a black indentured servant to life of servitude for running away from an abusive plantation owner Hugh Gwyn.","slug":null},{"year":1642,"type":"event","text":"Beginning of the English Civil War. Montreal founded.","slug":null},{"year":1643,"type":"event","text":"1645 – Kieft's War in New Netherland.","slug":null},{"year":1643,"type":"event","text":"New England Confederation created.","slug":null},{"year":1644,"type":"event","text":"1646 – Third Anglo–Powhatan War","slug":null},{"year":1649,"type":"event","text":"Maryland Toleration Act. Execution of King Charles I and the establishment of Commonwealth in England.","slug":null},{"year":1651,"type":"event","text":"In the wake of the English Civil War, Virginia acknowledges the authority of the Parliament of England.","slug":null},{"year":1655,"type":"event","text":"John Casor was declared a slave for life after Anthony Johnson, a free black man, sued Robert Parker for stolen services.","slug":null},{"year":1655,"type":"event","text":"New Sweden becomes incorporated into the Dutch colony of New Netherland","slug":null},{"year":1655,"type":"event","text":"Peach War","slug":null},{"year":1656,"type":"event","text":"Elizabeth Key Grinstead was one of the first black people to sue for freedom for alleged slavery and win.","slug":null},{"year":1656,"type":"event","text":"First Quakers arrive in New England.","slug":null},{"year":1658,"type":"event","text":"Death of Oliver Cromwell","slug":null},{"year":1659,"type":"event","text":"1663 – Esopus Wars","slug":null},{"year":1660,"type":"event","text":"Commonwealth of England collapses, Charles II is restored to the throne.","slug":null},{"year":1660,"type":"event","text":"The Royal African Company is founded.","slug":null},{"year":1662,"type":"event","text":"Halfway Covenant adopted.","slug":null},{"year":1662,"type":"event","text":"The Virginia Colony passed a law incorporating the principal of partus sequitur ventrem, ruling that children of enslaved mothers would be born into slavery, regardless of their father's race or status","slug":null},{"year":1663,"type":"event","text":"Gloucester County, Virginia Revolt","slug":null},{"year":1663,"type":"event","text":"King Charles II grants charter for a new colony, (Province of Carolina).","slug":null},{"year":1663,"type":"event","text":"The Rhode Island Royal Charter provided recognition to the Colony of Rhode Island and Providence Plantation, and outlined many freedoms including freedom of religion and acknowledged Indian rights to the soil.","slug":null},{"year":1664,"type":"event","text":"New Amsterdam captured by the English at the start of the Second Anglo-Dutch War. New Jersey and New York established as Proprietary Colonies of England.","slug":null},{"year":1665,"type":"event","text":"The Duke's Laws are issued.","slug":null},{"year":1667,"type":"event","text":"New Netherland ceded to England under Treaty of Breda.","slug":null},{"year":1667,"type":"event","text":"Virginia law enacted, declaring that baptism of slaves does not exempt them from bondage.","slug":null},{"year":1669,"type":"event","text":"1670 – John Lederer of Virginia explores the Appalachian Mountains.","slug":null},{"year":1669,"type":"event","text":"The Fundamental Constitutions of Carolina are drawn up.","slug":null},{"year":1669,"type":"event","text":"Virginia law enacted, that killing one's own enslaved people was not a felony.","slug":null},{"year":1670,"type":"event","text":"Charles Town (Charleston) founded in present-day South Carolina.","slug":null},{"year":1671,"type":"event","text":"The Batts-Fallam expedition sponsored by Abraham Wood reaches the New River (West Virginia).","slug":null},{"year":1672,"type":"event","text":"73 – Louis Jolliet and Jacques Marquette explore the Illinois Country.","slug":null},{"year":1672,"type":"event","text":"Blue Laws enacted in Connecticut.","slug":null},{"year":1674,"type":"birth","text":"Edward Burling born","slug":"burling-edward-1674-1749"},{"year":1674,"type":"event","text":"New Netherland permanently relinquished to English with Treaty of Westminster.","slug":null},{"year":1675,"type":"event","text":"King Philip's War (1675–76) in New England.","slug":null},{"year":1676,"type":"event","text":"Bacon's Rebellion in Virginia; Bacon writes the \"Declaration of the People of Virginia\".","slug":null},{"year":1677,"type":"event","text":"Colonists in North Carolina rebel against Thomas Colepeper, 2nd Baron Colepeper. Edmund Andros, Governor of New York, negotiates the Covenant Chain with the Iroquois. Province of Maine absorbed by Massachusetts Bay Colony.","slug":null},{"year":1678,"type":"birth","text":"William Burling born","slug":"burling-william-1678-1743"},{"year":1679,"type":"event","text":"War between the Westo and colonial South Carolina results in the destruction of the Westo. The Province of New Hampshire is created out of the Massachusetts Bay Colony by royal decree from King Charles II.","slug":null},{"year":1680,"type":"event","text":"Pueblo Revolution","slug":null},{"year":1681,"type":"event","text":"William Penn receives a royal charter from Charles II to establish Pennsylvania.","slug":null},{"year":1682,"type":"event","text":"René-Robert Cavelier, Sieur de La Salle explored the Ohio River Valley and the Mississippi River Valley, and he claimed the entire territory for France as far south as the Gulf of Mexico. William Penn publishes \"Frame of Government of Pennsylvania\" that provides for a precursor of a bicameral government. Philadelphia founded.","slug":null},{"year":1685,"type":"birth","text":"John Lawrence born","slug":"lawrence-john-1685-1765"},{"year":1685,"type":"event","text":"Charles II dies and his brother the Duke of York becomes King James II. Fort St. Louis (French colonization of Texas) established near Arenosa Creek on Matagorda Bay by French explorer Robert Cavelier de La Salle; the fort was abandoned in 1688.","slug":null},{"year":1686,"type":"event","text":"Arkansas Post established by Henri de Tonti as the first European settlement in the lower Mississippi River Valley.","slug":null},{"year":1688,"type":"event","text":"97 – King William's War, the North American theater of the Nine Years' War.","slug":null},{"year":1688,"type":"event","text":"The Glorious Revolution occurs; King James II flees to France and is replaced by William and Mary of Orange.","slug":null},{"year":1688,"type":"event","text":"The first recorded formal protest against slavery, the 1688 Germantown Quaker Petition Against Slavery.","slug":null},{"year":1689,"type":"event","text":"The English Parliament presents the English Bill of Rights to William and Mary and is later used as one of the models for the United States Bill of Rights. The Boston Revolt and Leisler's Rebellion occurs. Toleration Act 1688 is passed by Parliament which gives limited freedom of religion to all English subject.","slug":null},{"year":1690,"type":"event","text":"The first newspaper issue in the English colonies is published in Boston, the Public Occurrences.","slug":null},{"year":1692,"type":"event","text":"Salem Witch Trials","slug":null},{"year":1693,"type":"event","text":"College of William & Mary founded in Williamsburg, Virginia. Rice culture introduced in the Province of Carolina.","slug":null},{"year":1694,"type":"event","text":"Mary II dies, William III takes sole rule over England.","slug":null},{"year":1696,"type":"event","text":"Cahokia, Illinois established by French missionaries from Quebec and is one of the earliest permanent settlements in the region.","slug":null},{"year":1697,"type":"event","text":"The Treaty of Ryswick ends King William's War and restores all colonial possessions to pre-war ownership.","slug":null},{"year":1698,"type":"event","text":"The Parliament of England's Trade with Africa Act 1697 comes into effect, ending the Royal African Company's monopoly on English trade with Africa, including the Atlantic slave trade. The act, which was passed in part due to heavy pressure from merchants in England's American colonies, results in the number of Africans transported to the American colonies being increased from 5,000 to 45,000 per annum.","slug":null},{"year":1699,"type":"event","text":"Capital of Virginia moved from Jamestown to Williamsburg; Jamestown is slowly abandoned. The Wool Act forbade the export of wool from the American colonies. Free blacks ordered to leave the Colony of Virginia.","slug":null},{"year":1700,"type":"event","text":"José Romo de Vivar becomes one of the earliest European (Spanish) settlers in the future state of Arizona.","slug":null},{"year":1701,"type":"event","text":"The Collegiate school at Saybrook is founded in Connecticut; it will later be renamed as Yale College. Delaware Colony granted charter, separating it from Pennsylvania.","slug":null},{"year":1702,"type":"event","text":"William III dies, is succeeded by Queen Anne. Queen Anne's War (War of the Spanish Succession) begins. East Jersey and West Jersey become crown colonies. Mobile, Alabama founded.","slug":null},{"year":1703,"type":"event","text":"Kaskaskia, Illinois established as a small mission station for the French.","slug":null},{"year":1704,"type":"event","text":"The first regular newspaper publishes its initial edition in Boston, the News-Letter and was begun by John Campbell. The Province of Carolina allows the arming of the enslaved population during time of war.","slug":null},{"year":1705,"type":"event","text":"The House of Burgesses passes the Virginia Slave Codes of 1705.","slug":null},{"year":1706,"type":"event","text":"Benjamin Franklin born in Boston. Albuquerque founded and named for the viceroy of New Spain, Francisco Fernández de la Cueva, 10th Duke of Alburquerque.","slug":null},{"year":1710,"type":"event","text":"Francis Nicholson takes Port Royal.","slug":null},{"year":1711,"type":"event","text":"15 – North Carolina fights the Tuscarora War with the Tuscarora people.","slug":null},{"year":1712,"type":"event","text":"New York Slave Revolt of 1712.","slug":null},{"year":1713,"type":"event","text":"The Treaty of Utrecht is signed, bringing an end to Queen Anne's War; England gains Nova Scotia.","slug":null},{"year":1714,"type":"event","text":"Queen Anne dies; succeeded by George I. Natchitoches established by Louis Juchereau de St. Denis, making it the oldest permanent European settlement in the modern state of Louisiana.","slug":null},{"year":1715,"type":"event","text":"South Carolina begins the Yamasee War.","slug":null},{"year":1717,"type":"birth","text":"Ebenezer Burling born","slug":"burling-ebenezer-1717-1758"},{"year":1718,"type":"event","text":"Mission San Antonio de Valero (The Alamo) built as the first Spanish mission along the San Antonio River. New Orleans founded by the French. Blackbeard is killed in battle by lieutenant Robert Maynard in the waters off the Province of North Carolina.","slug":null},{"year":1721,"type":"birth","text":"John Lawrence born","slug":"lawrence-john-1721-1764"},{"year":1723,"type":"event","text":"The House of Burgesses passes an act to deal with slave rebellions. The French establish Fort Orleans along the Missouri River near Brunswick, Missouri.","slug":null},{"year":1725,"type":"birth","text":"Richard Lawrence born","slug":"lawrence-richard-1725-1781"},{"year":1725,"type":"event","text":"Father Rale's War (1722–25)","slug":null},{"year":1727,"type":"event","text":"George I dies, is succeeded by George II. British construct Fort Oswego.","slug":null},{"year":1729,"type":"event","text":"Province of Carolina proprietors sell out to Crown. City of Baltimore founded.","slug":null},{"year":1732,"type":"event","text":"The Province of Georgia is founded by General James Oglethorpe. Where slavery was prohibited.","slug":null},{"year":1733,"type":"birth","text":"Thomas Lawrence born","slug":"lawrence-thomas-1733-1817"},{"year":1735,"type":"event","text":"John Peter Zenger is found innocent of libel by the New York City trial on August 4.","slug":null},{"year":1737,"type":"birth","text":"David Lawrence born","slug":"lawrence-david-1737-1809"},{"year":1737,"type":"birth","text":"Jonathan Lawrence born","slug":"lawrence-jonathan-1737-1812-major-new-york-provincial-militia"},{"year":1737,"type":"event","text":"Benjamin Lay writes All Slave-Keepers That Keep the Innocent in Bondage, Apostates. Published by Benjamin Franklin in Philadelphia.","slug":null},{"year":1739,"type":"event","text":"40 – George Whitefield begins his travels throughout the colonies. His message of d Soviet Premier Gorbachev release statements indicating that the Cold War between their nations may be coming to an end. Symbolic elsewhere around the world was the fall of the Berlin Wall in Germany.","slug":null},{"year":1989,"type":"event","text":"President Bush declares a \"War on Drugs.\"","slug":null},{"year":1989,"type":"event","text":"The 1989 Loma Prieta earthquake kills 63 in the greater San Francisco Bay Area. The quake occurs in the midst of Game 3 of the 1989 World Series, caught live on television broadcasts by ABC.","slug":null},{"year":1989,"type":"event","text":"The animated television  sitcom The Simpsons debuts on Fox.","slug":null},{"year":1989,"type":"event","text":"The tanker  Exxon Valdez oil spill in Alaska's Prince William Sound, dumping 10.8 million US gallons of oil into pristine wildlife habitat.","slug":null},{"year":1989,"type":"event","text":"Time Inc. and Warner Communications announce plans for a merger, forming Time Warner.","slug":null},{"year":1990,"type":"event","text":"Hubble Space Telescope launches during STS-31, a Space Shuttle Discovery mission.","slug":null},{"year":1991,"type":"event","text":"The Cold War ends as the USSR is dissolved. The United States becomes the only superpower in the world.","slug":null},{"year":1991,"type":"event","text":"The Gulf War is waged in the Middle East, by a U.N.-authorized coalition force from thirty-four nations, led by the U.S. and United Kingdom, against Iraq.","slug":null},{"year":1991,"type":"event","text":"The World Wide Web first debuts as an Internet service.","slug":null},{"year":1991,"type":"event","text":"present","slug":null},{"year":1991,"type":"event","text":"present","slug":null},{"year":1991,"type":"event","text":"present","slug":null},{"year":1991,"type":"event","text":"present","slug":null},{"year":1991,"type":"event","text":"present","slug":null},{"year":1991,"type":"event","text":"present","slug":null},{"year":1991,"type":"event","text":"present","slug":null},{"year":1991,"type":"event","text":"present","slug":null},{"year":1992,"type":"event","text":"Hurricane Andrew, a Category 5 hurricane, kills 65 people and causes $26 billion in damage to Florida and other areas of the U.S. Gulf Coast, and will be the costliest natural disaster until Hurricane Katrina in 2005.","slug":null},{"year":1992,"type":"event","text":"Hurricane Iniki is the strongest hurricane ever to hit Hawaii.","slug":null},{"year":1992,"type":"event","text":"Los Angeles riots result in over 60 deaths and $1 billion in damage, spurred by the acquittal of four Los Angeles Police Department officers accused in the videotaped beating of black motorist Rodney King.","slug":null},{"year":1992,"type":"event","text":"U.S. presidential election, 1992: Bill Clinton elected president; Al Gore elected vice president.","slug":null},{"year":1993,"type":"event","text":"A truck bomb explodes in the parking garage under the World Trade Center in New York City, killing six people and injuring over a thousand.","slug":null},{"year":1993,"type":"event","text":"Branch Davidians standoff and fire near Waco, Texas, resulting in the deaths of 81 people including their leader, David Koresh.","slug":null},{"year":1993,"type":"event","text":"Clinton becomes the 42nd president; Gore becomes the 45th vice president.","slug":null},{"year":1993,"type":"event","text":"Massive flooding along the Mississippi and Missouri Rivers kill 50 people and devastate the Midwest with $15–$20 billion in damage.","slug":null},{"year":1993,"type":"event","text":"President Clinton signs 'Don't ask, don't tell' into law which prohibits gay or bisexual people from serving openly in the military.","slug":null},{"year":1993,"type":"event","text":"The \"Storm of the Century\" strikes the Eastern Seaboard, with blizzard conditions and severe weather, killing 300 people and causing $6 billion in damage.","slug":null},{"year":1994,"type":"event","text":"1994 Northridge earthquake kills 72 and injures 9,000 in the Los Angeles area and causes $20 billion in damage.","slug":null},{"year":1994,"type":"event","text":"Former Arkansas state employee Paula Jones accuses President Clinton of sexual harassment.","slug":null},{"year":1994,"type":"event","text":"North American Free Trade Agreement goes in effect.","slug":null},{"year":1994,"type":"event","text":"The United States hosts the FIFA World Cup, which is won by Brazil.","slug":null},{"year":1995,"type":"event","text":"1996 — A budget crisis forces the federal government to shut down for several weeks.","slug":null},{"year":1995,"type":"event","text":"A heat wave kills 739 in Chicago, bringing to attention the plight of the urban poor and the elderly in extreme weather conditions.","slug":null},{"year":1995,"type":"event","text":"Oklahoma City bombing kills 168 and wounds 800. The bombing is the worst domestic terrorist incident in U.S. history, and the investigation results in the arrests of Timothy McVeigh and Terry Nichols.","slug":null},{"year":1995,"type":"event","text":"Retired professional football player O. J. Simpson is acquitted of two charges of first-degree murder in the 1994 slayings of his ex-wife, Nicole Brown Simpson, and Ronald Goldman. The nine-month trial receives worldwide publicity.","slug":null},{"year":1996,"type":"event","text":"Centennial Olympic Park bombing at Summer Olympics in Atlanta kills 1 and injures 111.","slug":null},{"year":1996,"type":"event","text":"Khobar Towers bombing leaves 19 U.S. servicemen dead in Saudi Arabia.","slug":null},{"year":1996,"type":"event","text":"TWA Flight 800 explodes off Long Island killing all 230 aboard.","slug":null},{"year":1996,"type":"event","text":"U.S. presidential election, 1996: Bill Clinton is re-elected president, Al Gore is re-elected vice president.","slug":null},{"year":1997,"type":"event","text":"President Clinton and Vice President Gore begin their second terms.","slug":null},{"year":1997,"type":"event","text":"Sparked by a global economic crisis scare, the Dow Jones Industrial Average follows world markets and plummets 554.26, or 7.18%, to 7,161.15.","slug":null},{"year":1998,"type":"event","text":"1999 — Clinton–Lewinsky scandal: President Clinton is accused of having a sexual relationship with 22-year-old White House intern Monica Lewinsky. This leads to the impeachment of Clinton later in the year by the U.S. House of Representatives. Clinton is acquitted of all impeachment charges of perjury and obstruction of justice in a 21-day Senate trial.","slug":null},{"year":1998,"type":"event","text":"In the 1998 United States elections, the Republicans hold both the House and the Senate.","slug":null},{"year":1999,"type":"event","text":"A violent tornado outbreak in Oklahoma kills 50 people, becoming the first one to produce $1 billion in damage.","slug":null},{"year":1999,"type":"event","text":"Along with the rest of the world, the U.S. prepares for the possible effects of the Y2K bug in computers, which was feared to cause computers to become inoperable and wreak havoc. The problem isn't as large as theorized, preparations are successful, and disaster is averted.","slug":null},{"year":1999,"type":"event","text":"Teenage students Eric Harris and Dylan Klebold murder 12 other students and one teacher at Columbine High School, sparking an international debate on gun control and bullying.","slug":null},{"year":1999,"type":"event","text":"The Dow Jones Industrial Average closes above the 10,000 mark for the first time, at 10,006.78.","slug":null},{"year":1999,"type":"event","text":"The first officer deliberately crashes EgyptAir Flight 990 south of Nantucket, Massachusetts, killing 217.","slug":null},{"year":2000,"type":"event","text":"The Arleigh Burke-class destroyer, the USS Cole (DDG-67) is bombed in Yemeni waters, killing seventeen U.S. Navy sailors.","slug":null},{"year":2000,"type":"event","text":"U.S. presidential election, 2000: Initial result inconclusive and the result in Florida is disputed. George W. Bush is certified president after a Supreme Court ruling. Al Gore wins the nationwide popular vote but loses the electoral college. Dick Cheney is certified vice president.","slug":null},{"year":2001,"type":"event","text":"American Airlines Flight 587 crashes in Queens, New York, killing 265.","slug":null},{"year":2001,"type":"event","text":"Anthrax attacks kill 5 and infect a further 17 through the U.S. Mail system.","slug":null},{"year":2001,"type":"event","text":"Bush becomes the 43rd president; Cheney becomes the 46th vice president.","slug":null},{"year":2001,"type":"event","text":"Congress passes an emergency bailout package for the airline industry as a result of the attacks","slug":null},{"year":2001,"type":"event","text":"Democrats gain narrow control of Senate after Jim Jeffords defects from the Republican Party.","slug":null},{"year":2001,"type":"event","text":"Economic Growth and Tax Relief Reconciliation Act of 2001 institutes large tax cuts.","slug":null},{"year":2001,"type":"event","text":"No Child Left Behind Act education reform bill passed.","slug":null},{"year":2001,"type":"event","text":"Patriot Act, increasing law enforcement agencies' ability to conduct searches in cases of suspected terrorism. Agencies were enforced.","slug":null},{"year":2001,"type":"event","text":"September 11 attacks; 19 terrorists hijack four planes and crash them into the World Trade Center, The Pentagon, and a field in Shanksville, Pennsylvania killing nearly 3,000 people and injuring over 6,000. All civilian air traffic is suspended for three days, the first time an unplanned suspension had occurred in U.S. history.","slug":null},{"year":2001,"type":"event","text":"The United States launches the invasion of Afghanistan marking the start of Operation Enduring Freedom.","slug":null},{"year":2002,"type":"event","text":"10 people are killed and 3 are injured in the Beltway sniper attacks around the Washington D.C. area.","slug":null},{"year":2002,"type":"event","text":"The Department of Homeland Security is created in the wake of the September 11 attacks.","slug":null},{"year":2002,"type":"event","text":"The United States withdraws from Anti-Ballistic Missile Treaty.","slug":null},{"year":2003,"type":"event","text":"A series of incidents occur that institute a crackdown on building, fire, and safety code violations across the United States, including the E2 nightclub stampede which killed 21, The Station nightclub fire which killed 100, and a porch collapse which killed 13.","slug":null},{"year":2003,"type":"event","text":"In Iraq, deposed Iraqi president Saddam Hussein is captured by U.S. special forces.","slug":null},{"year":2003,"type":"event","text":"Republicans retake narrow control of the Senate following 2002 elections.","slug":null},{"year":2003,"type":"event","text":"Space Shuttle Columbia disintegrates upon re-entry to the Earth's atmosphere, killing all seven astronauts and resulting in a 29-month suspension of the Space Shuttle program.","slug":null},{"year":2003,"type":"event","text":"The United States, United Kingdom, Australia, and Poland invades Iraq marking the start of Operation Iraqi Freedom.","slug":null},{"year":2003,"type":"event","text":"U.S. forces continue fighting an insurgency in Iraq while helping the Iraqis build a new army of their own and develop a democratic form of government","slug":null},{"year":2004,"type":"event","text":"Former President Ronald Reagan dies from complications resulting from Alzheimer's disease. He lies in state at the U.S. Capitol building before being interred.","slug":null},{"year":2004,"type":"event","text":"George W. Bush is re-elected president, Dick Cheney is re-elected vice president.","slug":null},{"year":2004,"type":"event","text":"Massachusetts becomes the first state to legalize same-sex marriage in compliance with a ruling from the state's Supreme Court ruling in Goodridge v. Department of Public Health","slug":null},{"year":2004,"type":"event","text":"The 2004 Atlantic hurricane season produces four deadly and damaging hurricanes which impact Florida, Charley, Frances, Ivan, and Jeanne, which kill a combined 100 people in the U.S. and produce over $50 billion in damage","slug":null},{"year":2004,"type":"event","text":"The social networking website Facebook is launched.","slug":null},{"year":2005,"type":"event","text":"Hurricane Katrina devastates the Louisiana, Mississippi, and Alabama coastlines killing at least 1,836 people and causing $81 billion in damage, making it the costliest natural disaster in U.S. history. Weeks later, Hurricane Rita causes $10 billion damage along the Louisiana and Texas coastlines. In October, Hurricane Wilma kills 35 and causes $20 billion in damage in Florida.","slug":null},{"year":2005,"type":"event","text":"President Bush and Vice President Cheney begin their second terms.","slug":null},{"year":2006,"type":"event","text":"The Democratic Party retakes control of both houses of Congress, and gains a majority of state governorships (28-22).","slug":null},{"year":2007,"type":"event","text":"A South Korean student shoots and kills 32 other students and professors in the Virginia Tech shooting before killing himself. It stands as the worst mass shooting in U.S. history until 2016 and spurs a series of debates on gun control and journalism ethics.","slug":null},{"year":2007,"type":"event","text":"Democrat Nancy Pelosi becomes the first female speaker of the U.S. House of Representatives.","slug":null},{"year":2007,"type":"event","text":"George W. Bush orders a troop surge which substantially increases the number of U.S. troops in Iraq and ultimately leads to reductions in casualties and major victories for coalition and Iraqi forces, against the insurgency.","slug":null},{"year":2007,"type":"event","text":"The Great Recession officially begins in December.","slug":null},{"year":2007,"type":"event","text":"The I-35W Mississippi River bridge in Minneapolis, Minnesota collapses, killing 13 people. The bridge collapse brings to national attention the need to rehabilitate the aging U.S. infrastructure system.","slug":null},{"year":2007,"type":"event","text":"The first IPhone is released for sale in the U.S.","slug":null},{"year":2008,"type":"event","text":"Hurricane Ike kills 100 people along the Texas coast, produces $31 billion in damage, and contributes to rising oil prices.","slug":null},{"year":2008,"type":"event","text":"Steven Kazmierczak kills five, injures 21, and then kills himself in the Northern Illinois University shooting. After this incident, calls are made for more focus on mental health services and interest grows substantially in the group Students for Concealed Carry on Campus.","slug":null},{"year":2008,"type":"event","text":"The 2008 financial crisis begins as the stock market crashes. In response, U.S. President George W. Bush signs the revised Emergency Economic Stabilization Act into law to create a 700 billion dollar Treasury fund to purchase failing bank assets.","slug":null},{"year":2008,"type":"event","text":"The Super Tuesday tornado outbreak kills over 60 people and produces $1 billion in damage across Arkansas, Kentucky, Tennessee, and Alabama.","slug":null},{"year":2008,"type":"event","text":"U.S. oil prices hit a record $147 per barrel in the wake of—among other factors—international tensions and the falling U.S. dollar vs. the Euro.","slug":null},{"year":2008,"type":"event","text":"U.S. presidential election, 2008: Barack Obama is elected president, and Joe Biden elected vice president.","slug":null},{"year":2009,"type":"event","text":"Nidal Hasan kills 12 servicemen and injures 31 in the 2009 Fort Hood shooting.","slug":null},{"year":2009,"type":"event","text":"Obama becomes the 44th president, Biden becomes the 47th vice president. Obama is the first African-American to hold the office.","slug":null},{"year":2009,"type":"event","text":"Pop icon Michael Jackson dies, creating the largest public mourning for an entertainer since the death of Elvis Presley.","slug":null},{"year":2009,"type":"event","text":"President Obama obtains Congressional approval for the $787 billion stimulus package, the largest since President Dwight D. Eisenhower.","slug":null},{"year":2009,"type":"event","text":"The first of a series of Tea Party protests are conducted across the United States, focusing on smaller government, fiscal responsibility, individual freedoms and conservative views of the Constitution.","slug":null},{"year":2010,"type":"event","text":"present","slug":null},{"year":2010,"type":"event","text":"present","slug":null},{"year":2010,"type":"event","text":"present","slug":null},{"year":2010,"type":"event","text":"present","slug":null},{"year":2010,"type":"event","text":"present","slug":null},{"year":2010,"type":"event","text":"present","slug":null},{"year":2010,"type":"event","text":"present","slug":null},{"year":2010,"type":"event","text":"present","slug":null},{"year":2011,"type":"event","text":"present","slug":null},{"year":2011,"type":"event","text":"present","slug":null},{"year":2011,"type":"event","text":"present","slug":null},{"year":2011,"type":"event","text":"present","slug":null},{"year":2011,"type":"event","text":"present","slug":null},{"year":2011,"type":"event","text":"present","slug":null},{"year":2011,"type":"event","text":"present","slug":null},{"year":2011,"type":"event","text":"present","slug":null}]</script>
